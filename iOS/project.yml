name: Diaperline
options:
  bundleIdPrefix: com.shimondeitel.diaperline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Diaperline:
    type: application
    platform: iOS
    sources:
      - path: Diaperline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.diaperline
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Diaperline/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  DiaperlineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DiaperlineTests
      - path: Diaperline.storekit
    dependencies:
      - target: Diaperline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.diaperline.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  DiaperlineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DiaperlineUITests
    dependencies:
      - target: Diaperline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.diaperline.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Diaperline:
    build:
      targets:
        Diaperline: all
        DiaperlineTests: [test]
        DiaperlineUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Diaperline.storekit
    test:
      config: Debug
      storeKitConfiguration: Diaperline.storekit
      targets:
        - DiaperlineTests
        - DiaperlineUITests
    archive:
      config: Release
